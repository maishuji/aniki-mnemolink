name: Companion checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate wrapper JAR
        run: python3 tools/verify_wrapper.py
      - name: Desktop-only formatting, tests, build, and bundled image
        run: ./gradlew --no-daemon -PdesktopOnly=true :core:ktlintCheck :core:test :desktop:build :desktop:createDistributable
      - name: Bounded bundled-application smoke check
        run: timeout 30s xvfb-run -a desktop/build/compose/binaries/main/app/mnemolink/bin/mnemolink --smoke-test
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Validate wrapper JAR
        run: python3 tools/verify_wrapper.py
      - name: Formatting, unit tests, lint, and APK
        run: ./gradlew --no-daemon :core:ktlintCheck :core:test :app:ktlintCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
